name: perfect_hr_mobile
description: Perfect HR Mobile — AI-powered workforce companion.
publish_to: "none"
version: 0.1.0+1

# Dependency set is the approved stack from Tech-Stack §27 and Instructions §6.
# Constraints are caret ranges; run `flutter pub get` then commit the generated
# pubspec.lock so CI builds are reproducible (Instructions §30).
# Minimum Flutter 3.27: the design system uses Color.withValues and the
# *ThemeData component theme classes (CardThemeData, DialogThemeData,
# TabBarThemeData), none of which exist in 3.24.
environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # --- Wired in Task 1 -----------------------------------------------------
  flutter_riverpod: ^2.5.1 # State management — Tech-Stack §4
  go_router: ^14.2.7 # Navigation — Instructions §6

  # --- Wired in Task 2 -----------------------------------------------------
  dio: ^5.7.0 # HTTP client
  freezed_annotation: ^2.4.4 # Immutable models
  json_annotation: ^4.9.0 # Serialisation
  drift: ^2.20.0 # Local structured storage
  drift_flutter: ^0.2.0 # Platform database location for Drift
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  connectivity_plus: ^6.0.5 # Offline detection — UI-UX §48

  intl: ^0.19.0 # Dates, numbers, currency (BDT)
  # Opens WebAuthn enrolment in a real browser. Android's WebView has no
  # FIDO2 support, so the ceremony cannot run inside the app; see
  # features/settings/presentation/security_screen.dart.
  url_launcher: ^6.3.1
  # Bearer tokens live in Keystore/Keychain, never in the Drift cache:
  # that database is deliberately unencrypted (risk R9) and is safe only
  # while sensitive material stays out of it.
  flutter_secure_storage: ^9.2.2

  # --- Declared-but-unused plugins, removed 2026-09-10 ---------------------
  # These were declared "for planning" and imported by nothing (verified with
  # grep across lib/ and test/). Declaring a *native* plugin is not free: it
  # contributes its own Android requirements to the build even when no Dart
  # code touches it. flutter_appauth 8.0.0 compiles against android-31 while
  # its own androidx.fragment/androidx.window dependencies demand 34+, and that
  # alone failed `flutter build apk` with 20 AAR-metadata errors. The Firebase
  # trio would have followed, since they need google-services.json (Q9) and the
  # Google Services Gradle plugin, neither of which exists yet.
  #
  # Re-add each one in the task that actually imports it, so a build never
  # breaks for a dependency nothing uses:
  #
  #   Task 3 (auth):   flutter_secure_storage, local_auth
  #                    NOT flutter_appauth — Keycloak is no longer the plan;
  #                    Odoo will issue the bearer tokens directly.
  #   Task 8 (push):   firebase_core, firebase_messaging, firebase_crashlytics
  #   Task 10+ (viz):  fl_chart
  #
  # flutter_appauth: ^8.0.0
  # flutter_secure_storage: ^9.2.2
  # local_auth: ^2.3.0
  # firebase_core: ^3.6.0
  # firebase_messaging: ^15.1.3
  # firebase_crashlytics: ^4.1.3
  # fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  # freezed and json_serializable removed 2026-09-10. They were declared but
  # never used: the project deliberately hand-writes fromJson/toJson (see
  # PROJECT_STATE, Task 4) and `grep` finds no @freezed, @JsonSerializable or
  # *.freezed.dart anywhere. Leaving them in was not merely dead weight — the
  # freezed generator pins `analyzer` at language version 3.9, and Dart 3.13
  # (Flutter 3.47) added dot-shorthand syntax, so its AST visitor threw
  # "Missing implementation of visitDotShorthandPropertyAccess" on lib/app.dart
  # and build_runner then hung with no output. Drift is the only generator this
  # project actually needs.
  drift_dev: ^2.20.3
  mocktail: ^1.0.4 # Repository fakes for unit and widget tests
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Brand typeface is not yet licensed (Project State Q6). Until then
  # AppTypography.fontFamily stays null and the platform default is used.
  # To adopt a brand font: declare it here and set that constant.
  #
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
