name: Build

# Produces a downloadable debug APK on every push, so the app can be installed
# and reviewed without a local Flutter or Android toolchain.
#
# Tech-Stack §23. Addresses Project State TD-6.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.27.0"
  JAVA_VERSION: "17"

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Report toolchain
        run: flutter --version

      # The repository intentionally does not commit android/ and ios/. They
      # are generated output, they differ per Flutter version, and committing
      # them invites merge conflicts on every SDK bump. Generating here keeps
      # CI self-sufficient: nothing needs to be produced on a developer machine
      # before the first APK exists.
      - name: Generate platform folders
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android,ios \
              --project-name perfect_hr_mobile \
              --org com.perfecthr .
          fi

      - name: Apply Android configuration
        run: python3 scripts/configure_android.py

      - name: Resolve dependencies
        run: flutter pub get

      # Drift generates app_database.g.dart. The project does not compile
      # without this step.
      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      # Non-blocking for now: Tasks 1 and 2 were authored without a toolchain,
      # so the first runs are expected to surface findings. The APK is more
      # useful than a red run at this stage.
      # FLIP continue-on-error TO false ONCE BOTH ARE GREEN — that is the point
      # at which this workflow starts protecting the codebase instead of just
      # reporting on it.
      - name: Analyze
        continue-on-error: true
        run: flutter analyze

      - name: Test
        continue-on-error: true
        run: flutter test --reporter expanded

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=FLAVOR=dev

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: perfect-hr-mobile-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Surfaces failures without needing to expand a log: if a step above
      # reported findings, they are in the job summary.
      - name: Summary
        if: always()
        run: |
          {
            echo "### Perfect HR Mobile — build"
            echo ""
            echo "Flutter: \`${{ env.FLUTTER_VERSION }}\`  ·  Flavour: \`dev\`"
            echo ""
            echo "Download the APK from the **Artifacts** section of this run."
            echo ""
            echo "Analyze and test are non-blocking until the first green run."
          } >> "$GITHUB_STEP_SUMMARY"
